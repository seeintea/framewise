  #fw-camera-full-width .fw-zoom button[aria-pressed="true"]:after { bottom: 6px; width: 10px; height: 1px; background: var(--fw-accent); }
  #fw-camera-full-width .fw-bottom { bottom: 43px; height: 78px; padding: 0 30px; z-index: 7; background: transparent; }
  #fw-camera-full-width .fw-phone .fw-side { width: 44px; height: 48px; color: #fffdf1; background: transparent; }
  #fw-camera-full-width .fw-phone .fw-switch svg { width: 24px; height: 24px; stroke-width: 1.5; filter: drop-shadow(0 1px 3px #00000050); }
  #fw-camera-full-width .fw-phone .fw-album { border: 0; padding: 6px; border-radius: 0; }
  #fw-camera-full-width .fw-thumb { width: 32px; height: 38px; border-radius: 4px; border: 1px solid #fffdf185; box-shadow: 0 2px 8px #00000020; }
  #fw-camera-full-width .fw-phone .fw-shutter { width: 74px; height: 74px; border: 1px solid #f4f2e7; padding: 7px; border-radius: 23px; background: transparent; }
  #fw-camera-full-width .fw-shutter span { border-radius: 17px; background: #f2f0e4; box-shadow: 0 2px 9px #222c1818; }
  #fw-camera-full-width .fw-home { bottom: 8px; width: 102px; opacity: .55; }
  @media (max-width: 360px) { #fw-camera-full-width .fw-toolbar { top: 37px; } }
  @media (prefers-reduced-motion: reduce) { #fw-camera-full-width .fw-phone.is-shooting .fw-flash { animation: none; } }
</style>
<div id="fw-camera-full-width" class="viz-dotted-background" aria-label="沿用现有预览布局的相机概念">
  <section aria-label="相机画幅预览" class="fw-stage">
    <div class="fw-phone" aria-label="相机设计">
      <div class="fw-status"><span>9:41</span><span class="fw-status-right"><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
      <div class="fw-toolbar">

          <div class="fw-ratio-menu" aria-label="可选画幅" hidden>

<script>
(() => {
  const root = document.getElementById('fw-camera-full-width');
  const phone = root.querySelector('.fw-phone');
  const mount = phone.querySelector('.fw-photo-mount');
  const frame = phone.querySelector('.fw-photo-wrap');
  const scene = phone.querySelector('.fw-scene');
  const state = { accent: '#d4bc89', guide: 48, annotations: true, live: false, flash: false, zoom: '1', ratio: '3:4', corner: 12, shade: 34 };
  const ratios = { '3:4': 3/4, '1:1': 1, '9:16': 9/16 };
  let menuOpen = false;
  function restore(snapshot) {
    const saved = snapshot && snapshot.privateContent && snapshot.privateContent.alignedPreviewLayout;
    if (!saved || typeof saved !== 'object') return;
    for (const key of ['annotations','live','flash']) if (typeof saved[key] === 'boolean') state[key] = saved[key];
    if (['0.5','1','2'].includes(saved.zoom)) state.zoom = saved.zoom;
    if (Object.hasOwn(ratios,saved.ratio)) state.ratio = saved.ratio;
    if (typeof saved.corner === 'number' && saved.corner >= 6 && saved.corner <= 22) state.corner = saved.corner;
    if (typeof saved.guide === 'number' && saved.guide >= 25 && saved.guide <= 100) state.guide = saved.guide;
    if (typeof saved.shade === 'number' && saved.shade >= 0 && saved.shade <= 55) state.shade = saved.shade;
    if (typeof saved.accent === 'string' && /^#[0-9a-f]{6}$/i.test(saved.accent)) state.accent = saved.accent;
  }
  restore(window.openai && window.openai.widgetState);
  function persist() {
    if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({modelContent: { cameraLayout: {ratio: state.ratio, preview: 'current-code-centered-layout', shutter: 'floating-rounded-square', controlBackgrounds: false, showTemplateName: false, guideOpacity: state.guide, edgeShade: state.shade} },privateContent: { alignedPreviewLayout: state }}).catch(() => {});
  }
  function fitViewport() {
    // Match CameraScreen's available area: full top extent, excluding the bottom safe area.
    // The concept scales a 390 x 844 phone with a 34-point bottom safe area.
    phone.style.setProperty('--fw-safe-bottom', (phone.clientWidth * 34 / 390) + 'px');
    const bounds = mount.getBoundingClientRect();
    const ratio = ratios[state.ratio];
    const width = Math.min(bounds.width, bounds.height * ratio);
    const height = width / ratio;
    if (width <= 0 || height <= 0) return;
    frame.style.width = width + 'px';
    frame.style.height = height + 'px';
    const previewBottom = (bounds.height + height) / 2;
    const shutterTop = phone.querySelector('.fw-bottom').offsetTop;
    phone.style.setProperty('--fw-zoom-bottom', Math.max(12, previewBottom + 24 - shutterTop) + 'px');
    const sceneWidth = Math.max(width,height * 9/16);
    scene.style.width = sceneWidth + 'px';
    scene.style.height = sceneWidth * 16/9 + 'px';
  }
  phone.querySelectorAll('button').forEach(button => button.classList.add('cursor-interaction'));
  function render() {
      phone.style.setProperty('--fw-accent', state.accent);
      phone.style.setProperty('--fw-guide', state.guide / 100);
      phone.style.setProperty('--fw-shade-strength', state.shade / 100);
      phone.style.setProperty('--fw-corner', state.corner + 'px');
      phone.style.setProperty('--fw-scene-scale', state.zoom === '2' ? '2' : '1');
      phone.querySelector('.fw-ratio-label').textContent = state.ratio;
      phone.querySelector('.fw-ratio-menu').hidden = !menuOpen;
      phone.querySelector('[data-action="ratio-menu"]').setAttribute('aria-expanded', String(menuOpen));
      phone.querySelectorAll('[data-ratio]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.ratio === state.ratio)));
      phone.querySelector('.fw-mask').hidden = !state.annotations;
      phone.querySelector('.fw-flash-off').hidden = state.flash;
      phone.querySelector('.fw-flash-on').hidden = !state.flash;
      ['annotations','live','flash'].forEach(key => phone.querySelector('[data-action="' + key + '"]').setAttribute('aria-pressed', String(state[key])));
      phone.querySelectorAll('[data-zoom]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.zoom === state.zoom)));
      fitViewport();
    }
    render();
    const observer = new ResizeObserver(fitViewport);
    observer.observe(mount);
    phone.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || !phone.contains(button)) return;
      const action = button.dataset.action;
      if (['annotations','live','flash'].includes(action)) state[action] = !state[action];
      else if (button.dataset.zoom) state.zoom = button.dataset.zoom;
      else if (button.dataset.ratio) { state.ratio = button.dataset.ratio; menuOpen = false; }
      else if (action === 'ratio-menu') { menuOpen = !menuOpen; render(); return; }
      else if (action === 'capture') {
        phone.classList.remove('is-shooting');
        requestAnimationFrame(() => { phone.classList.add('is-shooting'); setTimeout(() => phone.classList.remove('is-shooting'),260); });
        return;
      } else return;
      render(); persist();
    });
    phone.addEventListener('keydown', event => { if (event.key === 'Escape' && menuOpen) { menuOpen = false; render(); phone.querySelector('[data-action="ratio-menu"]').focus(); } });
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: phone, onChange: () => { render(); persist(); } });
      tweak.addColorPicker(state, 'accent', { label: '构图强调色', reference: '--fw-accent' });
      tweak.addSlider(state, 'guide', { label: '构图线条强度', min: 25, max: 100, unit: '%', reference: '--fw-guide' });
      tweak.addToggle(state, 'annotations', { label: '显示构图引导' });
      tweak.addSlider(state, 'shade', { label: '底部渐暗强度', min: 0, max: 55, unit: '%', reference: '--fw-shade-strength' });
    }
  window.addEventListener('openai:set_globals', event => {
    if (event.detail && event.detail.globals && event.detail.globals.widgetState) { restore(event.detail.globals.widgetState); render(); }
  });
  if (globalThis.lucide) lucide.createIcons();
})();
</script>
